<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>大肥鱼桌宠</title>
  <!-- 透明背景：桌宠窗口靠这个透出桌面 -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      /* 允许鼠标穿透到桌面（空白区域由 bridge.js 动态切换） */
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <!--
    加载顺序很重要：
      1. bridge.js 先在页面上下文覆盖 window.fetch，把 /dsh-whale/* 请求接到主进程
      2. widget.js 再执行，此时它拿到的 fetch 已经是桌宠版
  -->
  <script src="./bridge.js"></script>
  <script src="./widget.js"></script>
</body>
</html>
